[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capri-eval"
version = "0.2.0"
description = "Does a quantised or exported model still decide to call its tools when it should, and not when it shouldn't?"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["transformers>=4.51", "torch", "jinja2", "numpy", "huggingface_hub", "jsonschema"]

[project.optional-dependencies]
gguf = ["llama-cpp-python>=0.3"]
pte = ["executorch>=1.0", "tokenizers"]
test = ["pytest"]

[project.scripts]
capri = "capri.cli:main"

[tool.setuptools]
packages = ["capri"]

[tool.setuptools.package-data]
capri = ["data/suites/*/*"]
